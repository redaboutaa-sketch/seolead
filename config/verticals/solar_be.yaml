# Solar Belgium — pilot vertical profile.
#
# This file is configuration, not code. Nothing here computes a yield, a saving or
# a subsidy: Phase 2 explicitly does not model Belgian solar economics, and
# `restricted_claims` exists to stop a draft from asserting one anyway.
#
# Bound to the EXISTING Prospect 360 tenant `solar-belgium`
# (64edc9e3-0b91-442a-9d02-7964f2001a55, verified in Phase 1 discovery). No lead is
# written anywhere in Phase 2 — the binding is recorded for Phase 6.

code: SOLAR_BE
name: Solar Belgium
market: BE
languages: [fr, nl]
default_language: fr

target_audience: >-
  Propriétaires belges de maison individuelle envisageant une installation
  photovoltaïque, ainsi que petites entreprises évaluant l'autoconsommation.

business_objective: >-
  Générer des demandes de devis et de rendez-vous qualifiées pour des
  installateurs photovoltaïques en Belgique, sans jamais promettre un rendement
  ou une aide financière non vérifiés.

conversion_goals:
  - quote_request
  - callback_request
  - personalised_assessment

cta_options:
  - code: quote_request
    label: Demander un devis personnalisé
    intents: [COMMERCIAL, TRANSACTIONAL]
  - code: callback_request
    label: Être rappelé par un conseiller
    intents: [COMMERCIAL, TRANSACTIONAL, LOCAL]
  - code: guide_download
    label: Recevoir le guide complet
    intents: [INFORMATIONAL]

# Only Phase 2 types are selectable; the loader filters the rest.
preferred_content_types:
  - GUIDE
  - COMPARISON
  - LANDING_PAGE
  - ARTICLE

# Topics that may never be asserted as fact without dated, sourced evidence.
# The QA layer treats a numeric claim near any of these as blocking unless the
# ResearchPackage supports it.
restricted_claims:
  - prime
  - primes
  - subside
  - subsides
  - certificat vert
  - certificats verts
  - tarif prosumer
  - prosumer
  - tva
  - rendement garanti
  - retour sur investissement
  - amortissement
  - économie garantie
  - subsidie
  - premie
  - groenestroomcertificaat

# Phrases that are always a blocking issue, regardless of evidence.
forbidden_phrases:
  - rendement garanti
  - économies garanties
  - gratuit à 100%
  - sans aucun risque
  - offre limitée
  - dernière chance
  - gegarandeerd rendement

commercial_terms: [prix, coût, tarif, devis, budget, combien, prijs, kosten, offerte]
comparison_terms: [comparatif, comparaison, versus, vs, meilleur, quel, vergelijking, beste]

# Sub-market localities. Regions matter here: Wallonia, Flanders and Brussels have
# genuinely different rules, so a query naming one wants local content.
local_terms: [wallonie, flandre, bruxelles, liège, namur, charleroi, gand, anvers, vlaanderen, brussel]

# The country's own names. Not local terms — "prix panneaux solaires Belgique" is
# a national commercial query, not a request for city-level content.
market_terms: [belgique, belgie, belgië, belgium]

# ── Provider policy (Phase 3) ────────────────────────────────────────────────
# Phase 2 measured that community research returns tech-community discussion,
# which supplied a racing-game post as the only "evidence" for a solar pricing
# query. A Belgian homeowner researching installation costs is not on Hacker News.
community_research_enabled: false
keyword_metrics_enabled: true

# Belgian energy regulators, grid operators and public authorities. High-risk
# claims (subsidies, tariffs, obligations) need a source of this calibre.
authoritative_domains:
  - energie.wallonie.be
  - energiesparen.be
  - leefmilieu.brussels
  - environnement.brussels
  - cwape.be
  - vreg.be
  - brugel.brussels
  - creg.be
  - fluvius.be
  - ores.be
  - economie.fgov.be

# ── Claim policy (Phase 3.1) ─────────────────────────────────────────────────
# Which vocabulary identifies which kind of assertion. Matched before the
# cross-vertical fallback so Belgian regulatory language is recognised correctly.
claim_categories:
  SUBSIDY: [prime, primes, subside, subsides, prime energie, certificat vert,
            certificats verts, subsidie, premie, groenestroomcertificaat]
  TAX: [tva, btw, taux de tva, taxe, impot]
  GRID_RULE: [tarif prosumer, prosumer, compteur qui tourne a l'envers,
              injection, raccordement, gestionnaire de reseau, fluvius, ores,
              sibelga, resa]
  REGULATION: [obligation, obligatoire, reglementation, decret, arrete,
               norme, peb]
  ELIGIBILITY: [eligible, eligibilite, conditions d'octroi, avoir droit]
  ROI: [retour sur investissement, amortissement, rentabilite, temps de retour]
  ENERGY_PRICE: [prix de l'electricite, tarif electricite, prix du kwh]
  GUARANTEED_SAVINGS: [rendement garanti, economies garanties, economie garantie]

# Requirements per category. Only overrides; anything absent uses the
# cross-vertical default in app/services/claim_policy.py.
authority_policy:
  SUBSIDY:
    authority: OFFICIAL
    freshness: REQUIRED
    risk: HIGH
    min_corroborating_sources: 1
    rationale: >-
      Belgian premiums differ by region and change annually. Only the granting
      authority establishes one; an installer quoting a premium is reporting,
      not establishing.
  GRID_RULE:
    authority: OFFICIAL
    freshness: REQUIRED
    risk: HIGH
    min_corroborating_sources: 1
    rationale: >-
      Metering and injection rules come from the regional regulator or the grid
      operator, and they have moved repeatedly in Belgium.
  MARKET_PRICE:
    authority: SPECIALIST
    freshness: PREFERRED
    risk: MEDIUM
    min_corroborating_sources: 3
    rationale: >-
      A Belgian market average must not rest on one or two installer pages.
      Three independent sources is a floor, not a survey — the figure should
      still be published as a range.
  VENDOR_PRICE:
    authority: ANY
    freshness: PREFERRED
    risk: LOW
    min_corroborating_sources: 1
    rationale: >-
      A vendor is the authority on its own displayed price, and establishes
      that price only — never a market average.

# Answering the price question. A page that ranks for "prix ..." and states no
# price has failed, but the fix is evidence, never invention — so the minimum
# number of comparable observations is set here rather than assumed in code.
price_policy:
  enabled: true
  # Two independent, comparable observations before a range may be stated. One is
  # a single source's figure and is reported as exactly that.
  observed_range_min_sources: 2
  # Intents whose page owes the reader a figure.
  answer_required_intents: [COMMERCIAL, TRANSACTIONAL]
  # Query vocabulary that makes this a price question.
  price_query_terms: [prix, coût, cout, tarif, tarifs, combien, budget, prijs, kost]

# Where targeted authoritative research looks when a HIGH-risk claim is
# unresolved. Placeholder shape: populate without changing orchestration code.
official_source_policy:
  enabled: true
  max_queries: 5

  # Each domain carries what it is authoritative ABOUT and FOR WHOM. The Walloon
  # energy portal establishes Walloon premiums and says nothing about Flemish grid
  # rules; a federal tax page covers the whole country. A flat list could not
  # express that, and generalising a regional rule to Belgium is a false statement
  # of law.
  domains:
    # ── Wallonia ────────────────────────────────────────────────────────────
    - domain: energie.wallonie.be
      name: Portail Énergie de Wallonie
      authority_type: GOVERNMENT
      region: BE-WAL
      market: BE
      languages: [fr]
      priority: 95
      claim_categories: [SUBSIDY, ELIGIBILITY, REGULATION, ROI, MARKET_AVERAGE]
    - domain: cwape.be
      name: CWaPE — régulateur wallon de l'énergie
      authority_type: REGULATOR
      region: BE-WAL
      market: BE
      languages: [fr]
      priority: 95
      claim_categories: [GRID_RULE, ENERGY_PRICE, REGULATION, TARIFF]
    - domain: ores.be
      name: ORES — gestionnaire de réseau wallon
      authority_type: GRID_OPERATOR
      region: BE-WAL
      market: BE
      languages: [fr]
      priority: 85
      claim_categories: [GRID_RULE, TARIFF, GRID_FEE]
    - domain: resa.be
      name: RESA — gestionnaire de réseau (Liège)
      authority_type: GRID_OPERATOR
      region: BE-WAL
      market: BE
      languages: [fr]
      priority: 75
      claim_categories: [GRID_RULE, TARIFF, GRID_FEE]

    # ── Brussels ────────────────────────────────────────────────────────────
    - domain: environnement.brussels
      name: Bruxelles Environnement
      authority_type: PUBLIC_AGENCY
      region: BE-BRU
      market: BE
      languages: [fr]
      priority: 95
      claim_categories: [SUBSIDY, ELIGIBILITY, REGULATION]
    - domain: leefmilieu.brussels
      name: Leefmilieu Brussel
      authority_type: PUBLIC_AGENCY
      region: BE-BRU
      market: BE
      languages: [nl]
      priority: 90
      claim_categories: [SUBSIDY, ELIGIBILITY, REGULATION]
    - domain: brugel.brussels
      name: BRUGEL — régulateur bruxellois
      authority_type: REGULATOR
      region: BE-BRU
      market: BE
      languages: [fr, nl]
      priority: 95
      claim_categories: [GRID_RULE, ENERGY_PRICE, REGULATION, TARIFF]
    - domain: sibelga.be
      name: Sibelga — gestionnaire de réseau bruxellois
      authority_type: GRID_OPERATOR
      region: BE-BRU
      market: BE
      languages: [fr, nl]
      priority: 85
      claim_categories: [GRID_RULE, TARIFF, GRID_FEE]

    # ── Flanders ────────────────────────────────────────────────────────────
    - domain: energiesparen.be
      name: Vlaams Energie- en Klimaatagentschap
      authority_type: PUBLIC_AGENCY
      region: BE-VLG
      market: BE
      languages: [nl]
      priority: 95
      claim_categories: [SUBSIDY, ELIGIBILITY, REGULATION, ROI, MARKET_AVERAGE]
    - domain: vreg.be
      name: VREG — Vlaamse regulator
      authority_type: REGULATOR
      region: BE-VLG
      market: BE
      languages: [nl]
      priority: 95
      claim_categories: [GRID_RULE, ENERGY_PRICE, REGULATION, TARIFF]
    - domain: fluvius.be
      name: Fluvius — Vlaamse netbeheerder
      authority_type: GRID_OPERATOR
      region: BE-VLG
      market: BE
      languages: [nl]
      priority: 85
      claim_categories: [GRID_RULE, TARIFF, GRID_FEE]
    - domain: vlaanderen.be
      name: Vlaamse overheid
      authority_type: GOVERNMENT
      region: BE-VLG
      market: BE
      languages: [nl]
      priority: 80
      claim_categories: [SUBSIDY, ELIGIBILITY, REGULATION]

    # ── Federal ─────────────────────────────────────────────────────────────
    - domain: economie.fgov.be
      name: SPF Économie
      authority_type: GOVERNMENT
      region: BE
      market: BE
      languages: [fr, nl]
      priority: 90
      claim_categories: [TAX, REGULATION, ENERGY_PRICE]
    - domain: finances.belgium.be
      name: SPF Finances
      authority_type: GOVERNMENT
      region: BE
      market: BE
      languages: [fr, nl]
      priority: 95
      claim_categories: [TAX, ELIGIBILITY]
    - domain: creg.be
      name: CREG — régulateur fédéral de l'énergie
      authority_type: REGULATOR
      region: BE
      market: BE
      languages: [fr, nl]
      priority: 90
      claim_categories: [ENERGY_PRICE, TARIFF, REGULATION]
    - domain: elia.be
      name: Elia — gestionnaire du réseau de transport
      authority_type: GRID_OPERATOR
      region: BE
      market: BE
      languages: [fr, nl]
      priority: 70
      claim_categories: [GRID_RULE, TARIFF]
    - domain: apere.org
      name: APERe — association pour la promotion des énergies renouvelables
      authority_type: OFFICIAL_PROGRAM
      region: BE
      market: BE
      languages: [fr]
      priority: 60
      claim_categories: [SUBSIDY, ROI, ENERGY_PRICE, MARKET_AVERAGE]

    # ── Candidats NON RATIFIÉS ──────────────────────────────────────────────
    # Le registre est une porte de confiance : y figurer autorise un domaine à
    # établir des affirmations à risque HIGH. Ces entrées sont proposées, pas
    # actives — `build_registry` les exclut tant que `pending_ratification` est
    # vrai, et seule la sonde `seolead authority probe --include-pending` les
    # interroge.
    #
    # Pourquoi elles existent : une affirmation de ROI de portée belge exige
    # 2 sources concordantes, et le registre ne contient qu'UN domaine dont la
    # région couvre BE (apere.org). Elle est donc insatisfiable par
    # construction, quelle que soit la qualité des pages retournées. Idem pour
    # BE-BRU.
    #
    # Ce que je NE peux pas affirmer depuis ce dépôt : que ces organismes
    # publient effectivement des chiffres de temps de retour pour une
    # installation résidentielle. L'egress est bloqué vers eux ; la sonde
    # existe pour que la question soit tranchée sur pièces et non sur ma
    # mémoire. Voir docs/authorities/ROI_AUTHORITIES_RATIFICATION.md.
    - domain: plan.be
      name: Bureau fédéral du Plan
      authority_type: GOVERNMENT
      region: BE
      market: BE
      languages: [fr, nl]
      priority: 75
      claim_categories: [ROI, ENERGY_PRICE, MARKET_AVERAGE]
      pending_ratification: true
    - domain: statbel.fgov.be
      name: Statbel — office belge de statistique
      authority_type: PUBLIC_AGENCY
      region: BE
      market: BE
      languages: [fr, nl]
      priority: 75
      claim_categories: [ENERGY_PRICE, MARKET_AVERAGE]
      pending_ratification: true

  # Claim-category-specific official queries. Regional variants matter: a single
  # "Belgium" query returns the federal level and misses the regional schemes
  # that actually set the premiums.
  query_templates:
    SUBSIDY: "prime panneaux photovoltaiques Wallonie Bruxelles conditions officielles"
    # Phase 3.2's tri-regional query returned no Flemish authority at all, so
    # BE-VLG claims had no official evidence. Flemish sources publish in Dutch, so
    # a French query does not reach them. A Flemish rule stays scoped BE-VLG.
    SUBSIDY_VLG: "premie zonnepanelen Vlaanderen voorwaarden officieel"
    GRID_RULE: "tarif prosumer injection compteur photovoltaique regulateur reseau"
    TAX: "taux TVA installation photovoltaique habitation"
    REGULATION: "reglementation installation photovoltaique obligations"
    ELIGIBILITY: "conditions octroi prime photovoltaique particuliers"
    ENERGY_PRICE: "prix electricite tarif regule menages"
    ROI: "rentabilite installation photovoltaique etude officielle"
    TARIFF: "tarif periodique reseau distribution electricite"
    # Phase 3.4: the pilot query is a price question, and the first live run
    # produced no answerable price at all. These look for cost guidance published
    # BY the bodies above — a figure they state is attributable, which is what a
    # market-average claim requires and a comparison site cannot supply.
    MARKET_AVERAGE: "cout moyen installation photovoltaique menage prix indicatif"
    MARKET_AVERAGE_VLG: "gemiddelde kostprijs zonnepanelen installatie richtprijs"
    OBSERVED_PRICE_RANGE: "prix installation photovoltaique kWc fourchette indicative"
    GRID_FEE: "cout raccordement installation photovoltaique reseau"

# ── Matching vocabulary (Phase 3.3) ──────────────────────────────────────────
# Context words, not topic words. Every page in this corpus contains them, so on
# their own they say nothing about whether two statements are about the same
# proposition. Phase 3.2 paired a prosumer-tariff claim with a market-price
# passage on `photovoltaique` + `installation` alone.
generic_terms:
  - prix
  - cout
  - coût
  - tarif
  - solaire
  - solaires
  - photovoltaique
  - photovoltaïque
  - panneau
  - panneaux
  - installation
  - installations
  - energie
  - énergie
  - electricite
  - électricité
  - belgique
  - belge
  - euro
  - euros
  - zonnepanelen
  - prijs

# Multi-word concepts that act as a claim's semantic head. The most specific
# phrase present wins, so "tarif prosumer" beats "tarif".
concept_phrases:
  - tarif prosumer
  - tarif d'injection
  - tarif de reseau
  - compteur qui tourne a l'envers
  - compteur bidirectionnel
  - compteur communicant
  - certificat vert
  - certificats verts
  - prime regionale
  - prime a l'installation
  - prime energie
  - retour sur investissement
  - temps de retour
  - duree d'amortissement
  - taux de tva
  - puissance installee
  - watt crete
  - autoconsommation
  - batterie domestique
  - onduleur hybride
  - raccordement au reseau
  - injection sur le reseau
  - gestionnaire de reseau
  - facture d'electricite
