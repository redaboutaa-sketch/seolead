# Solar Belgium — pilot vertical profile.
#
# This file is configuration, not code. Nothing here computes a yield, a saving or
# a subsidy: Phase 2 explicitly does not model Belgian solar economics, and
# `restricted_claims` exists to stop a draft from asserting one anyway.
#
# Bound to the EXISTING Prospect 360 tenant `solar-belgium`
# (64edc9e3-0b91-442a-9d02-7964f2001a55, verified in Phase 1 discovery). No lead is
# written anywhere in Phase 2 — the binding is recorded for Phase 6.

code: SOLAR_BE
name: Solar Belgium
market: BE
languages: [fr, nl]
default_language: fr

target_audience: >-
  Propriétaires belges de maison individuelle envisageant une installation
  photovoltaïque, ainsi que petites entreprises évaluant l'autoconsommation.

business_objective: >-
  Générer des demandes de devis et de rendez-vous qualifiées pour des
  installateurs photovoltaïques en Belgique, sans jamais promettre un rendement
  ou une aide financière non vérifiés.

conversion_goals:
  - quote_request
  - callback_request
  - personalised_assessment

cta_options:
  - code: quote_request
    label: Demander un devis personnalisé
    intents: [COMMERCIAL, TRANSACTIONAL]
  - code: callback_request
    label: Être rappelé par un conseiller
    intents: [COMMERCIAL, TRANSACTIONAL, LOCAL]
  - code: guide_download
    label: Recevoir le guide complet
    intents: [INFORMATIONAL]

# Only Phase 2 types are selectable; the loader filters the rest.
preferred_content_types:
  - GUIDE
  - COMPARISON
  - LANDING_PAGE
  - ARTICLE

# Topics that may never be asserted as fact without dated, sourced evidence.
# The QA layer treats a numeric claim near any of these as blocking unless the
# ResearchPackage supports it.
restricted_claims:
  - prime
  - primes
  - subside
  - subsides
  - certificat vert
  - certificats verts
  - tarif prosumer
  - prosumer
  - tva
  - rendement garanti
  - retour sur investissement
  - amortissement
  - économie garantie
  - subsidie
  - premie
  - groenestroomcertificaat

# Phrases that are always a blocking issue, regardless of evidence.
forbidden_phrases:
  - rendement garanti
  - économies garanties
  - gratuit à 100%
  - sans aucun risque
  - offre limitée
  - dernière chance
  - gegarandeerd rendement

commercial_terms: [prix, coût, tarif, devis, budget, combien, prijs, kosten, offerte]
comparison_terms: [comparatif, comparaison, versus, vs, meilleur, quel, vergelijking, beste]

# Sub-market localities. Regions matter here: Wallonia, Flanders and Brussels have
# genuinely different rules, so a query naming one wants local content.
local_terms: [wallonie, flandre, bruxelles, liège, namur, charleroi, gand, anvers, vlaanderen, brussel]

# The country's own names. Not local terms — "prix panneaux solaires Belgique" is
# a national commercial query, not a request for city-level content.
market_terms: [belgique, belgie, belgië, belgium]

# ── Provider policy (Phase 3) ────────────────────────────────────────────────
# Phase 2 measured that community research returns tech-community discussion,
# which supplied a racing-game post as the only "evidence" for a solar pricing
# query. A Belgian homeowner researching installation costs is not on Hacker News.
community_research_enabled: false
keyword_metrics_enabled: true

# Belgian energy regulators, grid operators and public authorities. High-risk
# claims (subsidies, tariffs, obligations) need a source of this calibre.
authoritative_domains:
  - energie.wallonie.be
  - energiesparen.be
  - leefmilieu.brussels
  - environnement.brussels
  - cwape.be
  - vreg.be
  - brugel.brussels
  - creg.be
  - fluvius.be
  - ores.be
  - economie.fgov.be

# ── Claim policy (Phase 3.1) ─────────────────────────────────────────────────
# Which vocabulary identifies which kind of assertion. Matched before the
# cross-vertical fallback so Belgian regulatory language is recognised correctly.
claim_categories:
  SUBSIDY: [prime, primes, subside, subsides, prime energie, certificat vert,
            certificats verts, subsidie, premie, groenestroomcertificaat]
  TAX: [tva, btw, taux de tva, taxe, impot]
  GRID_RULE: [tarif prosumer, prosumer, compteur qui tourne a l'envers,
              injection, raccordement, gestionnaire de reseau, fluvius, ores,
              sibelga, resa]
  REGULATION: [obligation, obligatoire, reglementation, decret, arrete,
               norme, peb]
  ELIGIBILITY: [eligible, eligibilite, conditions d'octroi, avoir droit]
  ROI: [retour sur investissement, amortissement, rentabilite, temps de retour]
  ENERGY_PRICE: [prix de l'electricite, tarif electricite, prix du kwh]
  GUARANTEED_SAVINGS: [rendement garanti, economies garanties, economie garantie]

# Requirements per category. Only overrides; anything absent uses the
# cross-vertical default in app/services/claim_policy.py.
authority_policy:
  SUBSIDY:
    authority: OFFICIAL
    freshness: REQUIRED
    risk: HIGH
    min_corroborating_sources: 1
    rationale: >-
      Belgian premiums differ by region and change annually. Only the granting
      authority establishes one; an installer quoting a premium is reporting,
      not establishing.
  GRID_RULE:
    authority: OFFICIAL
    freshness: REQUIRED
    risk: HIGH
    min_corroborating_sources: 1
    rationale: >-
      Metering and injection rules come from the regional regulator or the grid
      operator, and they have moved repeatedly in Belgium.
  MARKET_PRICE:
    authority: SPECIALIST
    freshness: PREFERRED
    risk: MEDIUM
    min_corroborating_sources: 3
    rationale: >-
      A Belgian market average must not rest on one or two installer pages.
      Three independent sources is a floor, not a survey — the figure should
      still be published as a range.
  VENDOR_PRICE:
    authority: ANY
    freshness: PREFERRED
    risk: LOW
    min_corroborating_sources: 1
    rationale: >-
      A vendor is the authority on its own displayed price, and establishes
      that price only — never a market average.

# Where targeted authoritative research looks when a HIGH-risk claim is
# unresolved. Placeholder shape: populate without changing orchestration code.
official_source_policy:
  enabled: true
  max_queries: 2
  # Region-specific because Wallonia, Flanders and Brussels genuinely differ.
  domains:
    - energie.wallonie.be
    - energiesparen.be
    - environnement.brussels
    - leefmilieu.brussels
    - cwape.be
    - vreg.be
    - brugel.brussels
    - creg.be
    - fluvius.be
    - ores.be
    - resa.be
    - sibelga.be
    - economie.fgov.be
    - finances.belgium.be
  query_templates:
    SUBSIDY: "{topic} prime officielle {market}"
    TAX: "{topic} taux TVA officiel {market}"
    GRID_RULE: "{topic} tarif prosumer regulateur {market}"
    REGULATION: "{topic} reglementation officielle {market}"
    ELIGIBILITY: "{topic} conditions officielles {market}"
