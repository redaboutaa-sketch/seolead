# Mon Projet Solaire — site configuration.
#
# `staging` and `seo.allow_indexing` are the publication gate. The loader
# refuses a configuration where a domainless site claims to be live, and
# refuses a staging site that permits indexing.
#
# PUBLICATION OUVERTE le 2026-08-31 sur autorisation explicite du
# propriétaire (« FINAL PUBLICATION APPROVAL — ALREADY GIVEN ») : staging
# false, allow_indexing true. Ce qui reste fermé le reste par sa propre
# porte, pas par celles-ci : la landing financement est servie et indexée
# UNIQUEMENT quand `offer.publishable` (validation propriétaire + revue
# juridique) ; /conditions reste noindex tant que son texte légal manque.

site_id: solar_be
vertical: SOLAR_BE

# Owner decision, 2026-08-13. No longer a placeholder.
brand_name: "Mon Projet Solaire"
brand_name_is_placeholder: false
domain: monprojetsolaire.be

market: BE
default_language: fr
# ── Campagne FR uniquement ──────────────────────────────────────────────────
# Décision du propriétaire, 2026-08-31 : cette campagne est francophone. Le
# néerlandais servira à une future campagne énergie aux Pays-Bas, pas à
# celle-ci.
#
# CONSÉQUENCE ASSUMÉE : le marché flamand n'est pas adressé par cette campagne.
# Un visiteur néerlandophone en Belgique verra le site en français ; aucune
# page ne lui est servie dans sa langue, et aucun lead flamand n'est capté par
# ce site.
#
# Rien de la mécanique NL n'est supprimé — routes, i18n, libellés placeholders
# « À TRADUIRE PAR UN NATIF » restent en place et resserviront. Retirer `nl`
# d'ici suffit à ce que la route /nl/demande-etude cesse d'être servie et à ce
# que la garde `pending_legal_review` cesse de compter des variantes de locale
# qui ne sont plus offertes : une locale non supportée ne collecte aucun
# consentement, donc son texte non validé ne peut plus en collecter non plus.
#
# Le jour où la campagne NL existe, la remettre ici suffit à tout rallumer — et
# la garde se remettra à bloquer tant que les textes NL ne sont pas validés,
# ce qui est exactement ce qu'on veut.
supported_languages: [fr]

staging: false

# The default language is unprefixed so the primary market's URLs stay short;
# Dutch is prefixed. Deliberately explicit rather than derived, because the
# convention differs per site and guessing it changes every canonical URL.
locale_paths:
  fr: ""
  nl: "/nl"

contact:
  # Fournis par le propriétaire le 2026-08-30. Plus un placeholder.
  email: "reda.boutaa@gmail.com"
  phone: "+33650855704"
  address: "43 rue de Marquillies, 59000 Lille, France"
  company_name: "Beaver Data Group"
  company_number: "935097675"
  lead_destination_email: "reda.boutaa@gmail.com"

legal:
  # Texte approuvé par le propriétaire le 2026-08-17. La version est ENREGISTRÉE
  # avec chaque consentement et voyage jusqu'à Prospect 360 : la changer sans
  # changer la version rendrait intraçable ce à quoi une personne a consenti.
  privacy_policy_path: /confidentialite
  terms_path: /conditions
  cookie_policy_path: null
  consent_version: "solar-be-consent-v1.0-2026-08-17"
  # Version de la POLITIQUE affichée sur /confidentialite. Incrémentée le
  # 2026-08-30 (section « Transmission à notre partenaire installateur »
  # ajoutée, phrase d'exclusion retirée — validé par le propriétaire,
  # responsable de traitement). Distincte de consent_version, qui identifie le
  # texte du consentement au traitement et reste v1.0-2026-08-17.
  privacy_policy_version: "solar-be-privacy-v1.1-2026-08-30"
  data_controller: "BEAVER DATA GROUP"
  privacy_contact_email: "reda.boutaa@gmail.com"
  reviewed: true

analytics:
  first_party_events: true
  ga4_measurement_id: null

seo:
  # Canonicals resolve against the production origin from now on, even while the
  # site is noindex. Getting this right before launch means no page ever carries a
  # canonical pointing at localhost or a container hostname.
  canonical_origin: "https://monprojetsolaire.be"
  # Owner decision, 2026-08-13: PUBLISHED pages may be served at their real URLs.
  # This is a soft launch — real address, real visitors, no search engines. It
  # enables the public route for content that has been explicitly published; it
  # publishes nothing by itself.
  allow_publication: true
  default_title_suffix: "Mon Projet Solaire"
  # Lighthouse flagged the homepage, /confidentialite and /conditions as having
  # no meta description. It was masked by the deliberate noindex failure in the
  # same category, so the SEO score looked like one intentional problem when it
  # was two problems, one of them real and waiting for launch day.
  #
  # Derived from copy already on the page rather than written fresh: it asserts
  # nothing the site does not already say.
  # Enrichie le 2026-08-31 (P1.2) : l'axe accessibilité financière, au
  # conditionnel — « selon votre situation », jamais une promesse.
  # Reformulée le 2026-08-31 (modèle SG Solution) : plus de « solutions de
  # financement » — le contrat n'est pas qualifié juridiquement, la copie ne
  # le qualifie pas non plus.
  default_meta_description: >-
    Photovoltaïque résidentiel en Belgique : décrivez votre projet en quelques
    questions et lisez des montants qui disent d'où ils viennent. Selon votre
    situation, une installation avec batterie peut être mise à disposition
    sans achat immédiat.
  organization_schema: false      # no real organisation data supplied yet
  sitemap_enabled: true
  # THE INDEXING GATE — unchanged, and stricter than allow_publication. Still
  # requires `staging: false` as well. Owner decision only.
  allow_indexing: true
  # Jetons de vérification Search Console / Bing Webmaster — fournis par le
  # propriétaire depuis chaque console, JAMAIS inventés. Null n'émet rien.
  # Poser le jeton avant allow_indexing est sûr et utile : la console prouve
  # la propriété et montre l'état noindex au lieu de le deviner.
  verification:
    google: null
    bing: null

# ── Registre d'offre de première partie ─────────────────────────────────────
# LA source de vérité pour ce que Mon Projet Solaire affirme de sa propre offre.
# Chaque valeur y figure parce que le propriétaire l'a FOURNIE (2026-08-31),
# jamais parce qu'un brief la mentionne. Fournie n'est PAS approuvée
# juridiquement : l'offre reste draft + pending_legal_review, donc AUCUN de ces
# chiffres n'est publiable (usable_facts vide, garde QA fail-closed) tant que
# les deux verrous — validation propriétaire du statut ET revue juridique —
# ne sont pas levés.
#
# Correspondance avec le cycle de vie RC1 (une seule mécanique, pas deux) :
#   fact_id → facts[].id · offer_id/offer_version → version · value → value
#   source → provenance (first_party = fourni par le propriétaire)
#   owner_status → validated_at (date de fourniture par le propriétaire)
#   legal_status → pending_legal_review + legal.* (au niveau de l'offre)
#   valid_from/valid_until → sur chaque fait.
#
# QUALIFICATION JURIDIQUE INCONNUE : ce modèle n'est décrit nulle part comme un
# crédit, un PPA, un leasing, une location-vente ou une fourniture d'énergie.
# Provisoirement : « solution SG Solution » / « contrat SG Solution ». La
# qualification appartient au juriste (docs/legal/SOLAR_BE_FINANCING_REVIEW.md).
offer:
  version: "sg-solution-solar-25y-v0.1-draft"
  status: draft            # draft | validated | retired
  pending_legal_review: true
  owner_validated_at: null
  # L'ancienne version (modèle « financement » hypothétique, emplacements
  # vides) est remplacée, pas réécrite.
  history:
    - version: "solar-be-offer-v0.1-draft"
      status: draft
      superseded_at: "2026-08-31"
      note: "Modèle crédit hypothétique remplacé par l'offre SG Solution (owner-supplied)."
  provider:
    name: "SG Solution"
    role: "commercial_solution_provider"
    # Identité légale, adresse, site, contacts publics : NON FOURNIS.
    # Aucun schéma Organization SG Solution n'est émis d'ici là.
  facts:
    - id: contract_duration_years
      label: "Durée du contrat SG Solution (années)"
      value: 25
      unit: YEARS
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
    - id: energy_tariff_eur_per_kwh
      label: "Tarif de l'électricité produite (€/kWh)"
      value: 0.27
      unit: EUR_PER_KWH
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
    - id: energy_tariff_fixed
      label: "Tarif annoncé fixe sur la durée du contrat"
      # Claim contractuel HIGH : « fixe / garanti 25 ans » exige une preuve
      # contractuelle (evidence.contract_reference) et un verdict juridique
      # avant toute formulation publique.
      value: true
      unit: null
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
    - id: administrative_fee_eur
      label: "Frais administratifs uniques à la signature (€)"
      value: 150
      unit: EUR
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
    - id: installation_includes
      label: "Installation mise à disposition"
      value: "solar_panels+home_battery"
      unit: null
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
    - id: classic_bank_credit_required
      label: "Crédit bancaire classique requis"
      value: false
      unit: null
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
    - id: buyout_possible_during_contract
      label: "Rachat possible en cours de contrat"
      value: true
      unit: null
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
    - id: buyout_annual_reduction_percent
      label: "Réduction annuelle annoncée du prix de rachat (%, sur la valeur initiale de l'installation)"
      # Assiette, méthode, plancher, HT/TTC, date de calcul : NON DÉFINIS.
      # Aucune projection (10 ans = -40 %…) n'est calculée nulle part.
      value: 4
      unit: PERCENT
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
    - id: ownership_transfer_after_years
      label: "Transfert de propriété automatique au terme (années, panneaux + batterie)"
      value: 25
      unit: YEARS
      validated_at: "2026-08-31"
      valid_from: null
      valid_until: null
  # Légué du modèle précédent — le modèle SG n'est PAS qualifié de financement ;
  # ce bloc reste vide et aucune copie ne doit le repeupler.
  financing:
    provider: null
    conditions: []
  # Conditions d'éligibilité owner-supplied. La préqualification (opérateur)
  # n'est jamais l'éligibilité finale : la décision appartient à SG Solution.
  eligibility:
    social_energy_tariff:
      eligible: false
    roof:
      asbestos_allowed: false
      technical_suitability_required: true
    electrical_installation:
      compliant_required: true
      good_condition_required: true
    building:
      technical_suitability_required: true
    final_acceptance:
      technical_review_required: true
      decision_by: "SG Solution"
  geography:
    service_areas: []
  guarantees: []
  restrictions: []
  worked_example: null
  # Preuves contractuelles : rien n'est fourni. Tant que c'est null, les
  # formulations « fixe » / « garanti » restent affaire de matrice juridique.
  evidence:
    contract_reference: null
    terms_reference: null
  # Offre alternative SG Solution quand l'installation est techniquement
  # impossible (toiture, orientation, structure…). AUCUN tarif fourni →
  # AUCUN prix généré, nulle part.
  fallback_offer:
    provider: "SG Solution"
    eligible_when:
      solar_technical_feasibility: false
    electricity_offer:
      available: true
    tariff:
      amount: null
    pending_legal_review: true
  legal:
    reviewed_at: null
    reviewer: null
    mandatory_disclosures: []

