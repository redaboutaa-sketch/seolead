# Mon Projet Solaire — site configuration.
#
# `staging: true` and `seo.allow_indexing: false` are the publication gate. The
# loader refuses a configuration where a domainless site claims to be live, and
# refuses a staging site that permits indexing.
#
# The domain is now owned and configured, and the site is STILL not indexable —
# that is deliberate and is the whole point of keeping indexability as three
# independent conditions rather than one flag. Having an address is not the same
# as being ready to be found at it.

site_id: solar_be
vertical: SOLAR_BE

# Owner decision, 2026-08-13. No longer a placeholder.
brand_name: "Mon Projet Solaire"
brand_name_is_placeholder: false
domain: monprojetsolaire.be

market: BE
default_language: fr
supported_languages: [fr, nl]

staging: true

# The default language is unprefixed so the primary market's URLs stay short;
# Dutch is prefixed. Deliberately explicit rather than derived, because the
# convention differs per site and guessing it changes every canonical URL.
locale_paths:
  fr: ""
  nl: "/nl"

contact:
  # PLACEHOLDER — all owner input.
  email: null
  phone: null
  address: null
  company_name: null
  company_number: null
  lead_destination_email: null

legal:
  # Texte approuvé par le propriétaire le 2026-08-17. La version est ENREGISTRÉE
  # avec chaque consentement et voyage jusqu'à Prospect 360 : la changer sans
  # changer la version rendrait intraçable ce à quoi une personne a consenti.
  privacy_policy_path: /confidentialite
  terms_path: /conditions
  cookie_policy_path: null
  consent_version: "solar-be-consent-v1.0-2026-08-17"
  data_controller: "BEAVER DATA GROUP"
  privacy_contact_email: "reda.boutaa@gmail.com"
  reviewed: true

analytics:
  first_party_events: true
  ga4_measurement_id: null

seo:
  # Canonicals resolve against the production origin from now on, even while the
  # site is noindex. Getting this right before launch means no page ever carries a
  # canonical pointing at localhost or a container hostname.
  canonical_origin: "https://monprojetsolaire.be"
  # Owner decision, 2026-08-13: PUBLISHED pages may be served at their real URLs.
  # This is a soft launch — real address, real visitors, no search engines. It
  # enables the public route for content that has been explicitly published; it
  # publishes nothing by itself.
  allow_publication: true
  default_title_suffix: "Mon Projet Solaire"
  # Lighthouse flagged the homepage, /confidentialite and /conditions as having
  # no meta description. It was masked by the deliberate noindex failure in the
  # same category, so the SEO score looked like one intentional problem when it
  # was two problems, one of them real and waiting for launch day.
  #
  # Derived from copy already on the page rather than written fresh: it asserts
  # nothing the site does not already say.
  default_meta_description: >-
    Photovoltaïque résidentiel en Belgique : décrivez votre projet en quelques
    questions, et lisez des montants qui disent d'où ils viennent.
  organization_schema: false      # no real organisation data supplied yet
  sitemap_enabled: true
  # THE INDEXING GATE — unchanged, and stricter than allow_publication. Still
  # requires `staging: false` as well. Owner decision only.
  allow_indexing: false

conversion:
  primary_cta: ESTIMATE_REQUEST
  primary_cta_label: "Obtenir mon estimation personnalisée"
  secondary_cta: CALLBACK_REQUEST
  secondary_cta_label: "Être rappelé"
  form_id: solar_qualification_v1
  consent_required: true
  marketing_consent_optional: true

  # Progressive disclosure: the project questions come first and carry visible
  # value, and contact details are requested last. A form that opens by demanding
  # a phone number converts worse and is a worse experience.
  form_steps:
    - key: project
      title: "Votre projet"
      description: "Quelques questions sur votre logement."
      fields: [owner_status, postcode, property_type]
    - key: roof
      title: "Votre toiture"
      description: "Pour situer la taille d'installation possible."
      fields: [roof_type, roof_orientation]
    - key: consumption
      title: "Votre consommation"
      description: "Facultatif — utile pour affiner l'estimation."
      fields: [annual_consumption_kwh, monthly_bill_eur, battery_interest]
    - key: timing
      title: "Votre échéance"
      fields: [project_timeframe]
    - key: contact
      title: "Vos coordonnées"
      description: "Pour vous transmettre l'estimation."
      fields: [first_name, last_name, email, phone, consent_processing,
               consent_followup_phone, consent_followup_whatsapp,
               consent_marketing, consent_partner_transfer]

  fields:
    - key: owner_status
      type: choice
      label: "Êtes-vous propriétaire du logement ?"
      required: true
      options:
        - {value: OWNER, label: "Propriétaire"}
        - {value: OWNER_TO_BE, label: "En cours d'achat"}
        - {value: TENANT, label: "Locataire"}
    - key: postcode
      type: postcode
      label: "Code postal"
      required: true
      pattern: "^[1-9][0-9]{3}$"
      help: "4 chiffres, ex. 1000"
    - key: property_type
      type: choice
      label: "Type de logement"
      required: true
      options:
        - {value: HOUSE, label: "Maison"}
        - {value: APARTMENT, label: "Appartement"}
        - {value: BUSINESS, label: "Bâtiment professionnel"}
    - key: roof_type
      type: choice
      label: "Type de toiture"
      required: false
      options:
        - {value: PITCHED, label: "Toiture inclinée"}
        - {value: FLAT, label: "Toiture plate"}
        - {value: MIXED, label: "Les deux"}
        - {value: UNKNOWN, label: "Je ne sais pas"}
    - key: roof_orientation
      type: choice
      label: "Orientation principale"
      required: false
      options:
        - {value: SOUTH, label: "Sud"}
        - {value: EAST_WEST, label: "Est / Ouest"}
        - {value: NORTH, label: "Nord"}
        - {value: UNKNOWN, label: "Je ne sais pas"}
    - key: annual_consumption_kwh
      type: number
      label: "Consommation annuelle (kWh)"
      required: false
      min: 0
      max: 100000
    - key: monthly_bill_eur
      type: number
      label: "Facture mensuelle moyenne (€)"
      required: false
      min: 0
      max: 10000
    - key: battery_interest
      type: choice
      label: "Une batterie domestique vous intéresse-t-elle ?"
      required: false
      options:
        - {value: YES, label: "Oui"}
        - {value: MAYBE, label: "Peut-être"}
        - {value: NO, label: "Non"}
    - key: project_timeframe
      type: choice
      label: "Quand souhaitez-vous réaliser le projet ?"
      required: true
      options:
        - {value: ASAP, label: "Dès que possible"}
        - {value: LT_6M, label: "Dans les 6 mois"}
        - {value: LT_12M, label: "Dans l'année"}
        - {value: EXPLORING, label: "Je me renseigne"}
    - key: first_name
      type: text
      label: "Prénom"
      required: false
      max_length: 120
    - key: last_name
      type: text
      label: "Nom"
      required: false
      max_length: 120
    - key: email
      type: email
      label: "Adresse e-mail"
      required: true
    - key: phone
      type: phone
      label: "Téléphone"
      required: false
      help: "Uniquement si vous souhaitez être rappelé."
    # Separate consents, one purpose per case. Bundling them would make the
    # necessary processing conditional on accepting the rest, which is not a
    # real choice.
    #
    # The two historical cases below keep their approved text UNCHANGED (version
    # solar-be-consent-v1.0-2026-08-17, via legal.consent_version). The three
    # cases marked `pending_legal_review: true` are MECHANICS ONLY: their labels
    # are placeholders awaiting counsel-validated wording, the loader refuses to
    # let them leave staging, and the day the texts land the whole change is
    # label + consent_version + dropping the flag — per case, in this file.
    - key: consent_processing
      type: consent
      consent_purpose: PROCESSING
      label: >-
        J'accepte que mes données personnelles soient traitées par BEAVER DATA
        GROUP, responsable du traitement de Solar Belgium, afin d'analyser ma
        demande relative à mon projet solaire, me recontacter à ce sujet et
        assurer le suivi de ma demande. J'ai pris connaissance de la Politique
        de confidentialité et je peux retirer mon consentement à tout moment.
      required: true
    - key: consent_followup_phone
      type: consent
      consent_purpose: FOLLOWUP_CONTACT
      consent_channel: PHONE
      consent_version: "solar-be-consent-followup-phone-v0.0-NON-VALIDE"
      pending_legal_review: true
      label: >-
        [PLACEHOLDER NON-VALIDÉ — texte en validation juridique, ne pas
        déployer] Consentement au suivi de la demande par TÉLÉPHONE.
      required: false
    - key: consent_followup_whatsapp
      type: consent
      consent_purpose: FOLLOWUP_CONTACT
      consent_channel: WHATSAPP
      consent_version: "solar-be-consent-followup-whatsapp-v0.0-NON-VALIDE"
      pending_legal_review: true
      label: >-
        [PLACEHOLDER NON-VALIDÉ — texte en validation juridique, ne pas
        déployer] Consentement au suivi de la demande par WHATSAPP.
      required: false
    - key: consent_marketing
      type: consent
      consent_purpose: MARKETING
      label: "J'accepte de recevoir des informations sur les offres et conseils."
      required: false
    - key: consent_partner_transfer
      type: consent
      consent_purpose: PARTNER_TRANSFER
      consent_version: "solar-be-consent-partner-v0.0-NON-VALIDE"
      pending_legal_review: true
      label: >-
        [PLACEHOLDER NON-VALIDÉ — texte en validation juridique, ne pas
        déployer] Consentement à la transmission de la demande au partenaire
        chargé de l'étude. La politique de confidentialité doit être mise à
        jour AVANT toute activation.
      required: false

# Routes the site knows about. Internal links may only target a path listed here,
# so a link cannot ship pointing at a page that does not exist.
routes:
  - {path: /, type: HOME, locales: [fr, nl]}
  # The published page's own canonical is /prix-panneaux-solaires-belgique. This
  # entry said /prix-panneaux-solaires, so the declared route and the canonical
  # disagreed and the navigation linked to a 404. The configuration is what was
  # stale here — the content has been published at the longer slug since Phase 4.
  - {path: /prix-panneaux-solaires-belgique, type: LANDING_PAGE, locales: [fr]}
  - {path: /outils/estimation-solaire, type: TOOL, locales: [fr]}
  - {path: /demande-etude, type: CONVERSION, locales: [fr]}
  - {path: /confidentialite, type: LEGAL, locales: [fr]}
  - {path: /conditions, type: LEGAL, locales: [fr]}
